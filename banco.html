<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashii ⚡ - Banco de Questões</title>

    <link rel="stylesheet" href="banco.css">
</head>

<body>



    <aside class="sidebar">

        <div class="logo">
            <img src="logo.png" alt="Flashii">
        </div>

        <a href="index.html" class="item">FlashCards</a>
        <a href="chat.html" class="item">Chat</a>
        <a href="ranking.html" class="item">Ranking</a>
        <a href="banco.html" class="item active">Banco de Questões</a>
        <a href="perfil.html" class="item">Perfil</a>
        <a href="donate.html" class="item">Doações</a>
        <a href="loja.html" class="item">Loja</a>
        <a href="pomodoro.html" class="item">Pomodoro</a>

    </aside>



    <main class="conteudo">

        <h1>Banco de Questões</h1>

        <div class="topo">

            <button id="btnNovoBanco">
                + Novo Banco
            </button>

            <select id="selectBanco">
            </select>

            <button id="btnNovaQuestao">
                + Nova Questão
            </button>

            <button id="btnExcluirBanco">
                Excluir Banco
            </button>
            <div class="ia-generator-box">
                <h3> ⚡ Gerador de Simulados Inteligente</h3>
            

                <button id="btnAtivarIA" class="btn-ia">
                    ✨ Criar Questões com IA
                </button>

                <div id="iaInputGroup" class="ia-input-group escondido">
                    <input type="text" id="temaIA"
                        placeholder="Que tipo de questão você quer? Ex: 5 questões de Geografia">
                    <button id="gerarQuestoesBtn" class="btn-ia">Gerar Simulados ✨</button>
                </div>
            </div>

        </div>

        <div id="listaQuestoes">

        </div>

    </main>



    <div class="overlay" id="popupBanco">

        <div class="popup">

            <h2>Criar Banco</h2>

            <input type="text" id="nomeBanco" placeholder="Nome do banco">

            <div class="popupBotoes">

                <button id="criarBanco">
                    Criar
                </button>

                <button id="fecharBanco">
                    Cancelar
                </button>

            </div>

        </div>

    </div>



    <div class="overlay" id="popupQuestao">

        <div class="popup">

            <h2>Nova Questão</h2>

            <textarea id="pergunta" placeholder="Digite a pergunta"></textarea>

            <input id="alternativaA" type="text" placeholder="Alternativa A">

            <input id="alternativaB" type="text" placeholder="Alternativa B">

            <input id="alternativaC" type="text" placeholder="Alternativa C">

            <input id="alternativaD" type="text" placeholder="Alternativa D">

            <label>

                Resposta correta:

                <select id="respostaCorreta">

                    <option value="0">
                        A
                    </option>

                    <option value="1">
                        B
                    </option>

                    <option value="2">
                        C
                    </option>

                    <option value="3">
                        D
                    </option>

                </select>

            </label>

            <div class="popupBotoes">

                <button id="salvarQuestao">
                    Salvar
                </button>

                <button id="fecharQuestao">
                    Cancelar
                </button>

            </div>

        </div>

    </div>

    <script src="banco.js"></script>

</body>

</html>
