                         <option>Ensino Médio</option>
                          <option>Ensino Fundamental</option>
                    </select>
                </div>
                <div class="caixa3">
                    <label>Instituição de Ensino</label>
                    <input type="text" placeholder="Ex: Colégio Progressão">
                </div>
                <button class="aceitar" onsubmit="cadastrarUsuario()">Cadastrar</button>
            </form>
        </div>
