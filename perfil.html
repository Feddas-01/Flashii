            <form class="grid" action="cadastrar.php" method="post">

                    <label>Nome Completo</label>
                    <input type="text" placeholder="Ex: Michael Jackson">
                </div>
                <div class="caixa2">
                    <label>Email</label>
                    <input type="email" placeholder="Ex: arthurmorello2007@gmail.com">
                </div>
                <div>
                    <label>Idade</label>
                    <input type="number" placeholder="Ex: Idade em anos">
                </div>
                <div>
                    <label>Nível de Escolaridade</label>
                    <select>
                        <option>Ensino Superior</option>
                        <option>Ensino Médio</option>
                        <option>Ensino Fundamental</option>
                    </select>
                </div>
                <div class="caixa3">
                    <label>Instituição de Ensino</label>
                    <input type="text" placeholder="Ex: Colégio Progressão">
                </div>
                <button type="submit" class="aceitar" onsubmit="cadastrarUsuario()">Cadastrar</button>
            </form>
        </div>
    </main>
