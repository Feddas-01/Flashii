<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashii ⚡ - Flashcards</title>

    <link rel="stylesheet" href="flashcards.css">
</head>

<body>



    <aside class="sidebar">

        <div class="logo">
            <img src="logo.png" alt="Flashii">
        </div>

        <a href="index.html" class="item active">FlashCards</a>
        <a href="chat.html" class="item">Chat</a>
        <a href="ranking.html" class="item">Ranking</a>
        <a href="banco.html" class="item">Banco de Questões</a>
        <a href="perfil.html" class="item">Perfil</a>
        <a href="donate.html" class="item">Doações</a>
        <a href="loja.html" class="item">Loja</a>
        <a href="pomodoro.html" class="item">Pomodoro</a>

    </aside>



    <main class="tela">

        <h1 class="texto">FlashCards</h1>



        <div class="topo">
            <div class="baralho-container">
                <label>Baralho:</label>
                <select id="baralhoSelect"></select>

                <button id="novoBaralhoBtn">+ Novo Baralho</button>

                <button id="excluirBaralhoBtn">Excluir Baralho</button>

                <button id="gerarBaralhoIABtn" class="btn-ia">
                    ✨ Criar com IA
                </button>
            </div>

        </div>




        <button class="b" onclick="abrirPopup()">
            +
        </button>



        <div id="listaFlashcards"></div>

    </main>

    >

    <div id="overlay" class="overlay">

        <div class="popup">

            <h2>Criar Flashcard</h2>

            <input type="text" id="pergunta" placeholder="Digite a pergunta">

            <input type="text" id="resposta" placeholder="Digite a resposta">

            <div class="popup-botoes">

                <button id="salvar">
                    Salvar
                </button>

                <button onclick="fecharPopup()">
                    Cancelar
                </button>

            </div>

        </div>

    </div>



    <div id="overlayBaralho" class="overlay">

        <div class="popup">

            <h2>Novo Baralho</h2>

            <input type="text" id="nomeBaralho" placeholder="Nome do baralho">

            <div class="popup-botoes">

                <button id="criarBaralho">
                    Criar
                </button>

                <button onclick="fecharPopupBaralho()">
                    Cancelar
                </button>

            </div>

        </div>

    </div>

    <script src="flashcards.js"></script>

</body>

</html>
