    <main class="main-content">
        <div class="pomodoro-container">
             <h1 class="texto">Pomodoro</h1> 
            
            <div class="config-box" id="configBox">
                <h3>⏱️ Configurar Timer</h3>
                <div class="input-group">
                    <input type="number" id="inputMinutos" min="1" max="60" value="25" placeholder="Minutos">
                    <button id="btnIniciar" class="btn-pomodoro">Iniciar Foco</button>
                </div>
             

    <div class="pomodoro-container" style="margin-top: auto; max-width: 480px;">
        </div>
            </div>

            <div class="timer-box escondido" id="timerBox">
                <div class="countdown" id="countdownDisplay">25:00</div>
                <div class="control-buttons">
                    <button id="btnPausar" class="btn-control">Pausar</button>
                    <button id="btnResetar" class="btn-control btn-danger">Cancelar</button>
                </div>
            </div>

        </div>
    </main>
